name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: t2l
          POSTGRES_PASSWORD: t2l
          POSTGRES_DB: time2live_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U t2l" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://t2l:t2l@localhost:5432/time2live_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: production compose file
        run: |
          cp deploy/.env.production.example deploy/.env
          sed -i 's/^IMAGE_TAG=$/IMAGE_TAG=ci/; s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^ENCRYPTION_KEY=$/ENCRYPTION_KEY=ci/' deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --profile tools config --quiet
      - name: Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: cloud-init renders
        run: |
          ssh-keygen -q -t ed25519 -N '' -f /tmp/k
          deploy/make-cloud-init.sh /tmp/k.pub > /tmp/ci.yaml
          python3 -c "import yaml; d = yaml.safe_load(open('/tmp/ci.yaml')); assert d['runcmd'] and len(d['write_files']) == 3"
