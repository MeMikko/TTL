name: Deploy

# Builds the image for every successful CI run on main and deploys it to the Hetzner server.
# Deployment is skipped (with a notice) until the DEPLOY_HOST secret exists, so this is safe to
# merge before the server is set up. A manual run can redeploy any existing image tag (rollback).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy, e.g. a previous commit SHA (empty: build this ref)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="${INPUT_TAG:-$RUN_SHA}"
          [[ "$tag" =~ ^[A-Za-z0-9_.-]{1,128}$ ]] || { echo "::error::invalid tag"; exit 1; }
          {
            echo "tag=$tag"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" # GHCR needs lowercase
            echo "build=$([ -z "$INPUT_TAG" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.meta.outputs.build == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.meta.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.meta.outputs.build == 'true'
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Add protection rules (required reviewers, main only) under Settings → Environments.
    environment: production
    steps:
      - id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::DEPLOY_HOST secret not set; skipping deployment (docs/OPERATIONS.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure SSH
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Host keys are pinned (never StrictHostKeyChecking=no).
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          deploy/sync-and-deploy.sh "${USER_NAME:-deploy}@${HOST}" "$TAG"
