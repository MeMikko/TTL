[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5_000

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 120

[lint]
# Readability over micro-gas: `implementation` is a public getter name; the salt hash is cold-path.
exclude_lints = ["asm-keccak256", "screaming-snake-case-immutable"]
# Tests cast fuzz inputs and salt literals on purpose.
ignore = ["test/**/*.sol"]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
